# The live DB migration history has drifted from this repo's migrations directory:
# two unrelated repo lineages plus migrations applied out-of-band.
# Run `supabase db push` only manually after reconciling history with
# `supabase migration list --linked` and `supabase migration repair`.

name: Deploy Supabase

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID --password $SUPABASE_DB_PASSWORD

      - name: Push Migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: supabase functions deploy recipe-search --project-ref $SUPABASE_PROJECT_ID
