import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def googleServicesFile = file('google-services.json')
def hasAndroidGoogleOauth = false
if (googleServicesFile.exists()) {
    try {
        def parsed = new JsonSlurper().parseText(googleServicesFile.text)
        def oauthClients = (parsed?.client ?: []).collectMany { client ->
            client?.oauth_client ?: []
        }
        hasAndroidGoogleOauth = oauthClients.any { oauthClient ->
            oauthClient?.client_type == 1 || oauthClient?.android_info != null
        }
    } catch (Exception ignored) {
        hasAndroidGoogleOauth = false
    }
}

android {
    namespace = "in.qook.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        applicationId "in.qook.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.0.8"
        buildConfigField "boolean", "HAS_ANDROID_GOOGLE_OAUTH", hasAndroidGoogleOauth.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                def props = new Properties()
                props.load(new FileInputStream(keystorePropertiesFile))
                storeFile = file(props['storeFile'])
                storePassword = props['storePassword']
                keyAlias = props['keyAlias']
                keyPassword = props['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            
            // This addresses the "native code" warning by including symbols in the bundle
            ndk {
                debugSymbolLevel = 'SYMBOL_TABLE'
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation project(':capacitor-android')
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    
    // Firebase BoM - manages Firebase library versions
    implementation platform('com.google.firebase:firebase-bom:34.8.0')
    
    // Firebase Cloud Messaging for push notifications
    implementation 'com.google.firebase:firebase-messaging'
    
    // Firebase Analytics (optional but recommended)
    implementation 'com.google.firebase:firebase-analytics'
    
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

def latestDebugApkOutput = rootProject.file('../release_builds')

tasks.register('copyLatestDebugApk', Copy) {
    from(layout.buildDirectory.file('outputs/apk/debug/app-debug.apk'))
    into(latestDebugApkOutput)
    rename { 'qook-latest-debug.apk' }
    doFirst {
        latestDebugApkOutput.mkdirs()
    }
    onlyIf {
        layout.buildDirectory.file('outputs/apk/debug/app-debug.apk').get().asFile.exists()
    }
}

afterEvaluate {
    tasks.named('assembleDebug').configure {
        finalizedBy(tasks.named('copyLatestDebugApk'))
    }
    tasks.named('installDebug').configure {
        finalizedBy(tasks.named('copyLatestDebugApk'))
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
